<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{{ self.header_title() }}</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; }
        .wrapper { padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); padding: 40px 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 28px; font-weight: 700; }
        .content { padding: 40px 30px; }
        .footer { background: #f9fafb; padding: 30px; text-align: center; border-top: 1px solid #e5e7eb; }
        .footer p { font-size: 13px; color: #9ca3af; margin: 5px 0; }
        .btn-container { text-align: center; margin: 30px 0; }
        .btn { display: inline-block; background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-weight: 600; font-size: 16px; transition: background-color 0.2s; }
    </style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="header">
      <h1>{% block header_title %}Welcome{% endblock %}</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>You're receiving this because you signed up for {{ proj_name }}.</p>
      <p>&copy; {{ proj_name }} {{ now().year }}. All rights reserved.</p>
    </div>
  </div>
</div>
</body>
</html>
