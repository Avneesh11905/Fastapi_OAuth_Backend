name: auth-template

networks:
  auth_network:
    driver: bridge

services:
  api:
    container_name: auth_api
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - auth_network

  db:
    container_name: auth_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - auth_network

  redis:
    container_name: auth_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    networks:
      - auth_network

  celery_worker:
    container_name: auth_celery
    build: .
    restart: unless-stopped
    command: celery -A src.shared.adapters.task_runner.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - auth_network
